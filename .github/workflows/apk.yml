name: Gerar APK (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        run: npx cap add android

      - name: Número da versão
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle || true

      - name: Ícones e tela de abertura
        run: npm run icones
        continue-on-error: true

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Chave de assinatura fixa (permite atualizar sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../livro-amarelo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: livro-amarelo-apk
          path: livro-amarelo.apk

      - name: Publicar na página de versões (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teste-${{ github.run_number }}
          name: Versão de teste ${{ github.run_number }}
          body: APK de teste gerado automaticamente a partir do commit ${{ github.sha }}.
          files: livro-amarelo.apk
          make_latest: true
